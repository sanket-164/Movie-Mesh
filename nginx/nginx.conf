# ================================
# Nginx Configuration File
# Reverse Proxy + Rate Limiting
# ================================

# Use all available CPU cores
worker_processes auto;

events {
  # Maximum simultaneous connections per worker
  worker_connections 1024;
}

http {
  include mime.types;

  # ================================
  # Rate Limiting Zones (Shared Memory)
  # ================================
  # Memory stores client IP + request counters
  # 10m ≈ ~160k unique IPs per zone

  # Authentication endpoints are sensitive → strict limit
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

  # Full search requests are heavier → moderate limit
  limit_req_zone $binary_remote_addr zone=search:10m rate=5r/s;

  # Autocomplete / suggestions → higher frequency allowed
  limit_req_zone $binary_remote_addr zone=suggestions:10m rate=10r/s;

  # ================================
  # Upstream Services
  # ================================

  upstream auth_service {
    server auth-service;
  }

  upstream search_service {
    # Use least connections method (Default: round-robin)
    least_conn; 
    server search-service-1;
    server search-service-2;
    server search-service-3;
  }

  # ================================
  # Server Configuration
  # ================================

  server {
    listen 80;

    # ----------------
    # Auth Service
    # ----------------
    # Very strict rate limit to prevent brute-force attacks
    location /api/auth {
      # Allow 2 requests/sec + 1 short burst
      limit_req zone=auth burst=1;

      proxy_pass http://auth_service/auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----------------
    # Search API
    # ----------------
    # Moderate rate limit, fail fast instead of queueing
    location /api/search {
      # Allow 5 requests/sec + 2 burst
      limit_req zone=search burst=2;

      proxy_pass http://search_service/search;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----------------
    # Search Suggestions (Autocomplete)
    # ----------------
    # High-frequency endpoint, optimized for UX
    location /api/search/suggestions {
      # Allow fast typing (10 req/sec + burst), block abuse instantly
      limit_req zone=suggestions burst=5 nodelay;

      proxy_pass http://search_service/search/suggestions;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
